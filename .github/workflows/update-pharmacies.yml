name: Multi-Daily Pharmacy Rosters & Release Builder

on:
  schedule:
    # 4 times daily (UTC):
    # - 04:17 UTC (07:17 Athens): Morning opening rota switch (08:00)
    # - 10:47 UTC (13:47 Athens): Afternoon handover (evening shift 17:00-21:00)
    # - 16:23 UTC (19:23 Athens): Overnight emergency rota switch (21:00-08:00)
    # - 21:17 UTC (00:17 Athens): Date rollover (pre-warms tomorrow shifts)
    - cron: '17 4 * * *'
    - cron: '47 10 * * *'
    - cron: '23 16 * * *'
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pharmacy-updater
  cancel-in-progress: false

jobs:
  scrape-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crawl duty rosters across 505 municipalities
        run: python scraper.py

      - name: Package dataset & compress artifacts
        run: python package_dataset.py

      - name: Commit updated master registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pharmacies_master.json
          git diff --staged --quiet || git commit -m "chore(data): sync master registry [skip ci]"
          git push || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(cat tag.txt)
          gh release create "$TAG" \
            pharmacies_latest.min.json \
            pharmacies_latest.min.json.zst \
            --title "PharmaFinder Greece $TAG (Official Sources)" \
            --notes-file release_notes.md \
            --latest
